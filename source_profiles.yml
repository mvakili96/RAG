# The source name must exactly match the PDF filename.
# Each non-empty table-of-contents line is embedded separately for document routing.
# Keep one chapter or closely related group of topics on each line.
sources:
  "Computer Vision: Algorithms and Applications.pdf":
    table_of_contents: |
      Introduction — what computer vision is; brief history; book overview; notation.
      Image formation — geometric primitives; 2D and 3D transformations; rotations; 3D-to-2D projection; lens distortion; photometric formation; lighting; reflectance; shading; optics; digital cameras; sampling; aliasing; color; compression.
      Image processing — point, pixel, and color operators; compositing; matting; histogram equalization; linear, separable, band-pass, steerable, nonlinear, and bilateral filtering; binary images; Fourier transforms; sharpening; blur and noise removal; pyramids; wavelets; interpolation; multiresolution blending; geometric transformations; warping; morphing.
      Model fitting and optimization — scattered-data interpolation; radial basis functions; overfitting and underfitting; robust fitting; variational methods; regularization; discrete energy minimization; total variation; bilateral solver; Markov and conditional random fields; interactive colorization and segmentation.
      Deep learning — supervised, unsupervised, and semi-supervised learning; nearest neighbors; Bayesian classification; logistic regression; support vector machines; decision trees; random forests; clustering; k-means; Gaussian mixtures; PCA; manifold learning; neural networks; backpropagation; regularization; convolutional neural networks; adversarial examples; self-supervision; 3D CNNs; RNNs; transformers; generative models.
      Recognition — instance recognition; image classification; visual similarity search; face recognition; face, pedestrian, and general object detection; semantic, instance, and panoptic segmentation; pose estimation; video understanding; vision and language.
      Feature detection and matching — points and patches; feature detectors; descriptors; matching; large-scale retrieval; tracking; edges and contours; snakes; scissors; level sets; rotoscoping; lines; Hough transforms; vanishing points; graph-based segmentation; mean shift; normalized cuts.
      Image alignment and stitching — pairwise 2D and 3D alignment; least squares; iterative algorithms; robust least squares and RANSAC; image stitching; parametric motion; document scanning; panoramas; global alignment; bundle adjustment; parallax removal; compositing; deghosting; photomontage; blending.
      Motion estimation — translational and hierarchical motion estimation; Fourier alignment; parametric and spline motion; video stabilization; medical registration; optical flow; rolling-shutter correction; multi-frame motion; video denoising; layered and transparent motion; frame interpolation; video object segmentation and tracking.
      Computational photography — photometric and radiometric calibration; camera response; noise; vignetting; optical blur; high dynamic range imaging; tone mapping; flash photography; super-resolution; denoising; deblurring; demosaicing; bokeh; image and video matting; compositing; texture analysis and synthesis; inpainting; neural style transfer; semantic image synthesis.
      Structure from motion and SLAM — intrinsic calibration; vanishing points; single-view metrology; radial distortion; pose estimation; localization; triangulation; two-frame and multi-frame structure from motion; five, seven, and eight-point algorithms; projective reconstruction; self-calibration; factorization; bundle adjustment; sparse optimization; simultaneous localization and mapping; autonomous navigation; augmented reality.
      Depth estimation — epipolar geometry; rectification; plane sweep; sparse and dense stereo correspondence; similarity measures; local, subpixel, and global optimization; dynamic programming; deep neural networks; multi-view stereo; scene flow; volumetric reconstruction; shape from silhouettes; monocular depth.
      3D reconstruction — shape from shading, photometric stereo, texture, and focus; 3D scanning; range-data merging; digital heritage; surface, point, and volumetric representations; interpolation; simplification; geometry images; implicit surfaces; architectural, face, and human-body reconstruction and tracking; texture maps; albedos; BRDFs; 3D model capture.
      Image-based rendering — view interpolation; view-dependent textures; photo tourism; layered depth images; impostors; sprites; 3D photography; light fields; Lumigraphs; surface light fields; concentric mosaics; synthetic refocusing; environment mattes; video-based animation; free-viewpoint video; walkthroughs; neural rendering.
      Linear algebra and numerical techniques — SVD; eigenvalue decomposition; QR and Cholesky factorization; linear, total, and nonlinear least squares; direct sparse matrices; variable reordering; conjugate gradient; preconditioning; multigrid.
      Bayesian modeling and inference — estimation theory; maximum likelihood; least squares; robust statistics; priors; Bayesian inference; Markov random fields; uncertainty and error analysis.
      Supplementary material — computer-vision datasets and benchmarks; software; slides and lectures.

  "Designing Data-Intensive Applications.pdf":
    table_of_contents: |
      Reliable, Scalable, and Maintainable Applications — data systems; reliability; hardware faults; software errors; human errors; scalability; load and performance; maintainability; operability; simplicity; evolvability.
      Data Models and Query Languages — relational versus document models; NoSQL; object-relational mismatch; many-to-one and many-to-many relationships; declarative queries; MapReduce querying; graph models; property graphs; Cypher; graph queries in SQL; triple stores; SPARQL; Datalog.
      Storage and Retrieval — database data structures; hash indexes; SSTables and LSM-trees; B-trees and index tradeoffs; transaction processing versus analytics; data warehouses; star and snowflake schemas; column-oriented storage; compression; sort order; writes; data cubes; materialized views.
      Encoding and Evolution — data-encoding formats; language-specific formats; JSON; XML; binary formats; Thrift; Protocol Buffers; Avro; schemas; dataflow through databases; REST and RPC services; message-passing dataflow; compatibility; schema evolution.
      Replication — leaders and followers; synchronous and asynchronous replication; new followers; node outages; replication logs; replication lag; read-your-writes; monotonic reads; consistent-prefix reads; multi-leader and leaderless replication; write conflicts; quorums; sloppy quorums; hinted handoff; concurrent writes.
      Partitioning — partitioning with replication; key-range and hash partitioning; skew and hot spots; secondary indexes by document or term; rebalancing strategies and operations; request routing; parallel query execution.
      Transactions — ACID; single-object and multi-object operations; weak isolation; read committed; snapshot isolation; repeatable read; lost updates; write skew; phantoms; serializability; serial execution; two-phase locking; serializable snapshot isolation.
      The Trouble with Distributed Systems — partial failures; cloud and supercomputing; unreliable networks; fault detection; timeouts; unbounded delays; synchronous and asynchronous networks; unreliable clocks; clock synchronization; process pauses; knowledge and majority truth; Byzantine faults; system models.
      Consistency and Consensus — consistency guarantees; linearizability and its cost; ordering; causality; sequence numbers; total-order broadcast; distributed transactions; atomic commit; two-phase commit; fault-tolerant consensus; membership and coordination services.
      Batch Processing — Unix log analysis and Unix philosophy; MapReduce; distributed filesystems; reduce-side and map-side joins; batch-workflow outputs; Hadoop versus distributed databases; materializing intermediate state; graph and iterative processing; high-level APIs and languages.
      Stream Processing — event streams; messaging systems; partitioned logs; databases and streams; synchronizing systems; change data capture; event sourcing; state, streams, and immutability; stream-processing uses; event time; stream joins; fault tolerance.
      The Future of Data Systems — data integration and derived data; combining specialized tools; batch and stream processing; unbundling databases; composing storage technologies; applications around dataflow; observing derived state; correctness; constraints; timeliness; integrity; verification; predictive analytics; privacy and tracking.

  "Grokking-the-system-design-interview-free.pdf":
    table_of_contents: |
      System Design Interviews: a step-by-step guide — requirements clarification; system interfaces and APIs; back-of-the-envelope estimation; data models; high-level design; detailed design; identifying and resolving bottlenecks.
      Designing a URL Shortening service like TinyURL — encoding URLs; key generation; partitioning; replication; cache; load balancing; cleanup; telemetry; security.
      Designing Pastebin — requirements; APIs; database design; application and datastore layers; cleanup; partitioning; replication; cache; load balancing; security.
      Designing Instagram — capacity; high-level design; database schema; component design; reliability; redundancy; sharding; ranking; news-feed generation; caching; load balancing.
      Designing Dropbox — cloud storage; synchronization; message queues; block storage; file-processing workflow; deduplication; metadata partitioning; caching; load balancing; permissions; file sharing.
      Designing Facebook Messenger — chat; message handling and storage; user status; partitioning; caching; load balancing; fault tolerance; replication; group chat; push notifications.
      Designing Twitter — tweets; timelines; capacity; APIs; database schema; sharding; caching; timeline generation; replication; fault tolerance; load balancing; monitoring.
      Designing YouTube or Netflix — video streaming; APIs; database schema; metadata sharding; video deduplication; load balancing; caching; content delivery networks; fault tolerance.
      Designing Typeahead Suggestion — autocomplete; tries; permanent storage; scaling; partitioning; caching; replication; load balancing; fault tolerance; personalization.
      Designing an API Rate Limiter — throttling; rate-limiting algorithms; sliding windows; distributed rate limiting; caching; sharding.
      Designing Twitter Search — search requirements; indexing; ranking; sharding; replication; load balancing; cache.
      Designing a Web Crawler — crawling; politeness; robots.txt; URL frontier; deduplication; DNS resolution; distributed crawling; fault tolerance.
      Designing Facebook's Newsfeed — feed generation; ranking; fan-out; data storage; sharding; caching; load balancing.
      Designing Yelp or Nearby Friends — proximity and geospatial search; SQL; grids; dynamic-size grids; partitioning; replication; caching; ranking.
      Designing Uber backend — ride sharing; location updates; matching drivers and riders; scaling; replication; fault tolerance; ranking.
      Designing Ticketmaster — ticket booking; APIs; database design; concurrency; reservations; fault tolerance; partitioning.
      System Design Basics — scalability; reliability; availability; efficiency; serviceability; manageability; load balancing algorithms; caching; CDN; invalidation; eviction; sharding; indexes; proxies; redundancy; replication; SQL versus NoSQL; CAP theorem; consistent hashing; HTTP polling; long-polling; WebSockets; server-sent events.

  "LeetCode_4000_Problem_Reference.pdf":
    summary: >
      Reference catalog for LeetCode problems 1 through 4000. It identifies each
      problem by number, title, and Easy, Medium, or Hard difficulty and provides
      a link, short study summary, key algorithm and data-structure concepts, and
      typical time and space complexity. Topics include arrays, strings, hashing,
      two pointers, sliding windows, sorting, binary search, linked lists, stacks,
      queues, heaps, trees, binary search trees, tries, graphs, DFS, BFS,
      topological sort, union-find, shortest paths, dynamic programming, greedy,
      backtracking, divide-and-conquer, bit manipulation, prefix sums, matrices,
      segment trees, Fenwick trees, math, number theory, combinatorics, geometry,
      probability, database and SQL, JavaScript, pandas, concurrency, design, and
      simulation. Use it to identify or study a problem, its difficulty, concepts,
      or expected complexity, not for full problem statements or complete solutions.

  "Probabilistic Machine Learning.pdf":
    table_of_contents: |
      Introduction to Probabilistic Machine Learning: Advanced Topics.
      Fundamentals — probability; statistics; graphical models; information theory; optimization.
      Inference — inference algorithms; Gaussian filtering and smoothing; message passing algorithms; variational inference; Monte Carlo methods; Markov chain Monte Carlo; sequential Monte Carlo.
      Prediction — predictive models; generalized linear models; deep neural networks; Bayesian neural networks; Gaussian processes; models beyond the independent and identically distributed assumption.
      Generation — generative models; variational autoencoders; autoregressive models; normalizing flows; energy-based models; diffusion models; generative adversarial networks.
      Discovery — latent factor models; state-space models; graph learning; nonparametric Bayesian models; representation learning; interpretability.
      Action — decision making under uncertainty; reinforcement learning; causality.

  "Speech and Language Processing.pdf":
    table_of_contents: |
      Introduction to natural language processing, computational linguistics, speech recognition, and language models.
      Large Language Models — words and tokens; N-gram language models; logistic regression; embeddings; neural networks; transformers and pretraining; post-training.
      Advanced Language-Model Topics and Tools — masked language models; interpretability; retrieval-based models; retrieval-augmented generation; agents; machine translation; recurrent neural networks; LSTMs; phonetics; speech feature extraction; automatic speech recognition; text-to-speech.
      Annotating Linguistic Structure — sequence labeling; parts of speech; named entities; context-free grammars; constituency parsing; dependency parsing; information extraction; relations; events; time; semantic role labeling; sentiment; affect; connotation; coreference resolution; entity linking; discourse coherence; conversation structure.
